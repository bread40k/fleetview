<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FleetView</title>
<meta name="robots" content="noindex">
<script>
// Entry point: the landing page lives at home.html and the map at map.html.
// Old deep links (index.html#s=<id>&t=…) still work — anything with a hash goes straight to the map, keeping the hash.
(function(){ var h = location.hash; location.replace(h && h.length > 1 ? 'map.html' + h : 'home.html'); })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=home.html"></noscript>
</head>
<body><p>Redirecting to <a href="home.html">FleetView</a>…</p></body>
</html>
